services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backup-center-app:latest
    container_name: bc-app
    restart: unless-stopped
    environment:
      APP_NAME: "Backup Center"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: "Asia/Shanghai"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      TZ: Asia/Shanghai
    volumes:
      - bc-database:/var/www/html/database/data
      - bc-storage:/var/www/html/storage
    networks:
      - bcnet

  web:
    image: nginx:alpine
    container_name: bc-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/var/www/frontend:ro
      - ./agent-dist:/var/www/agent:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - bcnet

networks:
  bcnet:

volumes:
  bc-database:
  bc-storage:
