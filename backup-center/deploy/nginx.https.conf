server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 110M;
    # 大文件跨海上传时长；资源池 100MB 上限 + rclone 传到 COS 广州要够时间
    client_body_timeout 600s;
    send_timeout 600s;

    # ---------- Laravel API 走 PHP-FPM ----------
    location /api {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass  app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        # 透传真实客户端 IP 给 PHP（配合 Laravel TrustProxies），否则 $request->ip() 永远拿到 nginx 容器 IP
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;

        include fastcgi_params;
        # 大文件跨海上传：PHP 需要把文件继续 rclone 传到 COS，要给足时间
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 60;
    }

    # ---------- Agent 安装包 / 二进制托管 ----------
    location /agent/ {
        alias /var/www/agent/;
        try_files $uri =404;
        autoindex off;
        # 二进制走 application/octet-stream
        types {
            text/plain sh;
            application/octet-stream amd64 arm64;
        }
    }

    # ---------- Vue 静态资源 ----------
    root /var/www/frontend;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
