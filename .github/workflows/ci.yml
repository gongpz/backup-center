name: CI

# 质量门禁：后端跑 php artisan test，前端跑 npm run build。
# 之前任何改动都只靠本地手工验证，换人接手就没有兜底 —— 这个 workflow 补上这一层。
# 注意：要在 GitHub 上真正「拦住」不合格的合并，还需要在分支保护规则里
# 把 CI 的两个 job 设为 required status check（本文件做不到这件事）。

on:
  push:
    branches: [main]
    paths:
      - 'backup-center/backend/**'
      - 'backup-center/frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backup-center/backend/**'
      - 'backup-center/frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    # 用 MySQL 8 起服务容器，测试库引擎与生产一致，排除 sqlite 专属问题
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # composer.json 声明 php ^8.2，这里与本地环境（8.2.33）保持一致
      - name: 准备 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_mysql 是必需的：CI 用 MySQL 跑测试（phpunit.ci.xml）
          extensions: mbstring, xml, curl, zip, bcmath, intl, mysql, pdo_mysql
          coverage: none

      # 一次性环境自检：把 PHP 版本与关键扩展以 GitHub 注释（annotation）形式输出。
      # 目的是在拿不到运行日志（匿名 API 403）时，仍能确认 CI 环境 —— 尤其排查
      # 「本地全过、CI 全挂」这类由扩展缺失导致的应用启动失败。
      - name: PHP 环境自检
        run: |
          echo "::notice::PHP version: $(php -r 'echo PHP_VERSION;')"
          missing=""
          for ext in pdo_mysql mysql pdo_sqlite sqlite3 mbstring intl bcmath zip curl openssl tokenizer ctype json fileinfo dom xml sodium; do
            if ! php -m 2>/dev/null | grep -qi "^${ext}$"; then missing="$missing $ext"; fi
          done
          if [ -n "$missing" ]; then echo "::warning::MISSING extensions:$missing"; else echo "::notice::all key extensions present"; fi

      - name: 缓存 Composer 依赖
        uses: actions/cache@v4
        with:
          path: backup-center/backend/vendor
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('backup-center/backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.2-

      - name: 安装依赖
        working-directory: backup-center/backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 准备测试环境
        working-directory: backup-center/backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # MySQL 服务容器就绪前先探活。冷启动（首次拉 mysql:8.0 镜像）可能超过 60s，
      # 之前就是竞态导致「库没起好就跑测试」而失败；这里放宽到 ~180s 且没就绪就直接
      # 失败并注释出来，而不是带着连不上的库去跑测试、报一堆误导性错误。
      - name: 等待 MySQL 就绪
        working-directory: backup-center/backend
        run: |
          ready=0
          for i in $(seq 1 60); do
            if php -r "new PDO('mysql:host=127.0.0.1;port=3306;dbname=test','test','test');" 2>/dev/null; then
              ready=1; echo "MySQL ready (attempt $i)"; break
            fi
            echo "waiting for MySQL... ($i)"; sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::MySQL 服务在约 180 秒内未就绪，终止（避免冷启动竞态误导定位）"
            exit 1
          fi

      # CI 专用配置（phpunit.ci.xml）把测试库指向 MySQL；其余与原 phpunit.xml 一致。
      # 不直接用 composer test（它固定跑默认 sqlite 配置），这里显式指定配置。
      - name: 运行测试
        working-directory: backup-center/backend
        run: |
          set +e
          # 不用管道，直接重定向到文件 —— 确保 $? 就是 phpunit 的真实退出码。
          # （曾用 `| tee` + `code=$?`，在 pipefail 未生效时 $? 会变成 tee 的 0，
          #   把失败吞掉、导致门禁假绿；这个坑已修掉。）
          vendor/bin/phpunit --configuration phpunit.ci.xml --no-coverage > phpunit.out 2>&1
          code=$?
          # 无论成败都输出 phpunit 最终汇总，作为真实结果的长期凭证
          tail -3 phpunit.out | while IFS= read -r line; do echo "::notice::${line//%/%%}"; done
          if [ "$code" -ne 0 ]; then
            echo "::group::phpunit 失败定位"
            grep -nE "✘|Failed asserting|^[0-9]+\) |Exception|Error:|SQLSTATE|not found|Fatal|Call to undefined" phpunit.out | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%%}"
            done
            echo "::endgroup::"
          fi
          exit "$code"

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backup-center/frontend/package-lock.json

      - name: 安装依赖
        working-directory: backup-center/frontend
        run: npm ci

      # 只校验能否编译通过；不涉及 Pages 的 --base=/backup-center/（那是 demo-pages.yml 的事）
      - name: 构建
        working-directory: backup-center/frontend
        run: npm run build
