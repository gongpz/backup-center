name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建部署包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backup-center/frontend/package-lock.json

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 构建 bc-deploy.tar.gz
        run: bash scripts/build-release.sh

      - name: 上传到 Release（正式 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bc-deploy.tar.gz
          make_latest: true
          generate_release_notes: true

      # 滚动包用 gh 幂等重建，而不用 softprops 的 overwrite：
      # overwrite 走的是「覆盖已存在 release 的同名 asset」路径，但 bc-rolling release
      # 历史上从未创建成功过 → 找不到 release 就失败 → release 永远建不出来（先有鸡还是
      # 先有蛋，导致 main 分支的 Release 运行长期红灯）。这里改成「删旧的 → 全新创建」，
      # 无论 bc-rolling 是否已存在都能成功，且天然支持每次 push 覆盖。
      - name: 上传滚动包（main 最新，prerelease，每次覆盖）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete bc-rolling --yes 2>/dev/null || echo "→ 无旧滚动包，直接创建"
          gh release create bc-rolling bc-deploy.tar.gz \
            --target "${GITHUB_SHA}" \
            --title "滚动构建（main 最新）" \
            --prerelease \
            --notes "main 分支最新提交自动构建的滚动包，随每次 push 覆盖更新。用于 BC_CHANNEL=main 提前验证尚未发布的改动。"
